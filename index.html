<script type="module">

/* =====================================================================

/* =====================================================================

   ===================================================================== */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const MAX_PR = Math.min(window.devicePixelRatio || 1, 1.5);
let pixelRatio = Math.min(MAX_PR, 1.25);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

// fog: capped exponential so distant landmarks keep a silhouette
THREE.ShaderChunk.fog_fragment = `
#ifdef USE_FOG
  #ifdef FOG_EXP2
    float fogFactor = ( 1.0 - exp( - fogDensity * vFogDepth ) ) * 0.93;
  #else
    float fogFactor = smoothstep( fogNear, fogFar, vFogDepth );
  #endif
  gl_FragColor.rgb = mix( gl_FragColor.rgb, fogColor, fogFactor );

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0x0d121b);
scene.fog = new THREE.FogExp2(FOG_COLOR.getHex(), 0.02);
scene.background = FOG_COLOR.clone();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 1500);
scene.add(camera);
// shared uniforms for custom shaders
const U = {
  time: { value: 0 },         // story time (S)
  realTime: { value: 0 },
  fogColor: { value: FOG_COLOR },
  fogDensity: { value: 0.02 },
};

/* =====================================================================
   Procedural canvas textures
   ===================================================================== */
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function canvasTex(c, { srgb = true, repeat = true, aniso = MAX_ANISO } = {}) {

// height (0..1 Float32Array) -> tangent-space normal map canvas (tileable)
function heightToNormal(hgt, w, h, strength) {

// --- wet cobblestones (one tile = 3 m) ---
function makeCobbleTextures() {
  const S = 1024, r = mulberry32(11);

      x += w;

    const cx = (s.x0 + s.x1) / 2, cy = (s.y0 + s.y1) / 2, hw = (s.x1 - s.x0) / 2 - 3, hh = (s.y1 - s.y0) / 2 - 3;

// --- brick (one tile = 4 m) ---
function makeBrickTextures(seed, tint = [1, 1, 1]) {

// --- wood grain (planks) ---
function makeWoodTexture(seed, base = [0.32, 0.19, 0.11], planks = 6, size = 512) {

function makeCrateTexture() {

// --- concrete slabs (one tile = 3 m) ---

// --- water ripples normal map ---
function makeWaterNormal() {
  const S = 256; const hgt = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) hgt[y * S + x] = noise.fbm(x / S * 8, y / S * 8, 4, 8) * 0.7 + noise(x / S * 32, y / S * 32, 32) * 0.3;

}

// --- generic sprites ---

/* =====================================================================
   Static geometry batching (merge per material)
   ===================================================================== */
const batches = new Map();
function batchAdd(geo, mat, matrix, { cast = false } = {}) {
  const key = mat.uuid + (cast ? 'c' : '');
  if (!batches.has(key)) batches.set(key, { mat, cast, list: [] });
  const g = geo.index ? geo : (() => { const n = geo.attributes.position.count; geo.setIndex([...Array(n).keys()]); return geo; })();
  batches.get(key).list.push({ g, m: matrix.clone() });
}
function flushBatches(parent) {
  for (const { mat, cast, list } of batches.values()) {
    let nv = 0, ni = 0; for (const { g } of list) { nv += g.attributes.position.count; ni += g.index.count; }
    const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3), uv = new Float32Array(nv * 2);
    const idx = nv > 65535 ? new Uint32Array(ni) : new Uint16Array(ni);
    let ov = 0, oi = 0; const nm = new THREE.Matrix3();
    for (const { g, m } of list) {
      nm.getNormalMatrix(m);
      const P = g.attributes.position, N = g.attributes.normal, T = g.attributes.uv, I = g.index;
      for (let i = 0; i < P.count; i++) {
        _v1.fromBufferAttribute(P, i).applyMatrix4(m); pos.set([_v1.x, _v1.y, _v1.z], (ov + i) * 3);
        _v2.fromBufferAttribute(N, i).applyMatrix3(nm).normalize(); nor.set([_v2.x, _v2.y, _v2.z], (ov + i) * 3);
        if (T) { uv[(ov + i) * 2] = T.getX(i); uv[(ov + i) * 2 + 1] = T.getY(i); }
      }
      for (let i = 0; i < I.count; i++) idx[oi + i] = I.getX(i) + ov;
      ov += P.count; oi += I.count;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.setIndex(new THREE.BufferAttribute(idx, 1));
    geo.computeBoundingSphere();
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = cast; mesh.receiveShadow = true; mesh.matrixAutoUpdate = false;
    parent.add(mesh);
  }
  batches.clear();
}

function mtx(x, y, z, ry = 0, rx = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  _o.position.set(x, y, z); _o.rotation.set(rx, ry, rz); _o.scale.set(sx, sy, sz); _o.updateMatrix(); return _o.matrix;

function sBox(w, h, d, mat, x, y, z, { tile = 4, ry = 0, cast = false } = {}) {
  const g = new THREE.BoxGeometry(w, h, d);
  const P = g.attributes.position, N = g.attributes.normal, T = g.attributes.uv;
  for (let i = 0; i < P.count; i++) {
    const px = P.getX(i) + x, py = P.getY(i) + y, pz = P.getZ(i) + z;
    const nx = Math.abs(N.getX(i)), ny = Math.abs(N.getY(i));
    if (nx > 0.5) T.setXY(i, pz / tile, py / tile); else if (ny > 0.5) T.setXY(i, px / tile, pz / tile); else T.setXY(i, px / tile, py / tile);

/* ---------- the score ---------- */
function buildScore() {

  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,

    uniform sampler2D tDiffuse; uniform float uTime, uGrain, uFade, uFlash, uBars, uScope, uAspect, uVig;
    varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }
    void main(){
      vec3 c = texture2D(tDiffuse, vUv).rgb;
      float l = dot(c, vec3(0.299, 0.587, 0.114));
      c = mix(vec3(l), c, 0.86);
      c += vec3(-0.01, 0.006, 0.026) * (1.0 - l) * (1.0 - l) + vec3(0.035, 0.012, -0.025) * l * l;
      c = (c - 0.5) * 1.07 + 0.5;
      vec2 d = vUv - 0.5; d.x *= uAspect;
      c *= 1.0 - uVig * dot(d, d) * 1.2;
      float g = hash(vUv * vec2(1931.0, 1373.0) + fract(uTime * 7.31) * 113.0) - 0.5;
      float g2 = hash(floor(vUv * vec2(480.0, 270.0)) + fract(uTime * 3.7) * 71.0) - 0.5;
      c += (g * 0.7 + g2 * 0.3) * uGrain * (1.0 - l * 0.5);
      float speck = step(0.99993, hash(floor(vUv * vec2(320.0, 180.0)) + floor(uTime * 24.0)));
      c = mix(c, vec3(0.9), speck * 0.5);
      c += uFlash;
      if (uScope > 0.5) {
        float r = length(d);
        c *= 1.0 - smoothstep(0.38, 0.425, r) * 0.0;
        c *= 1.0 - smoothstep(0.3, 0.42, r) * 0.6;
        c = mix(c, vec3(0.0), smoothstep(0.415, 0.425, r));
      }
      c *= uFade;
      float bar = step(vUv.y, uBars) + step(1.0 - uBars, vUv.y);
      c = mix(c, vec3(0.0), clamp(bar, 0.0, 1.0));
      gl_FragColor = vec4(max(c, vec3(0.0)), 1.0);
    }`,
});
composer.addPass(finalPass);

/* =====================================================================
   HUD overlay (scope reticle, titles)
   ===================================================================== */
const hud = document.getElementById('hud'), hctx = hud.getContext('2d');
const titleEl = document.getElementById('title');
let hudDirty = true;
function drawScopeHUD(T, u) {
  const w = hud.width, h = hud.height, cx = w / 2, cy = h / 2, R = h * 0.42;
  hctx.clearRect(0, 0, w, h);
  hctx.save();
  hctx.strokeStyle = 'rgba(8,8,8,0.92)'; hctx.fillStyle = 'rgba(8,8,8,0.92)';
  const lw = Math.max(1, h / 700);
  hctx.lineWidth = lw;
  hctx.beginPath(); hctx.moveTo(cx - R, cy); hctx.lineTo(cx + R, cy); hctx.moveTo(cx, cy - R); hctx.lineTo(cx, cy + R); hctx.stroke();
  hctx.lineWidth = lw * 5;
  for (const [x0, y0, x1, y1] of [[cx - R, cy, cx - R * 0.35, cy], [cx + R * 0.35, cy, cx + R, cy], [cx, cy + R * 0.35, cx, cy + R]]) { hctx.beginPath(); hctx.moveTo(x0, y0); hctx.lineTo(x1, y1); hctx.stroke(); }
  for (let i = -6; i <= 6; i++) {
    if (!i) continue;
    const s = i * R * 0.05;
    hctx.beginPath(); hctx.arc(cx + s, cy, lw * 2.2, 0, TAU); hctx.fill();
    hctx.beginPath(); hctx.arc(cx, cy + s, lw * 2.2, 0, TAU); hctx.fill();
  }
  for (let i = 1; i <= 5; i++) { const y = cy + i * R * 0.06; hctx.fillRect(cx - R * 0.02 * (6 - i) * 0.6, y - lw / 2, R * 0.04 * (6 - i) * 0.6, lw); }
  hctx.fillStyle = 'rgba(255,40,30,0.95)'; hctx.beginPath(); hctx.arc(cx, cy, lw * 2, 0, TAU); hctx.fill();
  // range readout
  const settle = smooth(0.15, 0.7, u);
  const range = Math.round(lerp(1300 + Math.sin(T * 40) * 90, 1184, settle));
  const wind = (lerp(6 + Math.sin(T * 23) * 2, 3.4, settle)).toFixed(1);
  hctx.font = `600 ${Math.round(h * 0.022)}px "Courier New", monospace`;
  hctx.fillStyle = settle > 0.99 ? 'rgba(255,70,50,0.95)' : 'rgba(255,190,120,0.9)';
  hctx.textAlign = 'right';
  hctx.fillText(`RNG ${String(range).padStart(4, '0')} M`, cx + R * 0.82, cy + R * 0.5);
  hctx.fillText(`WND ${wind} L`, cx + R * 0.82, cy + R * 0.5 + h * 0.03);
  hctx.textAlign = 'left';
  hctx.fillText(`ELV +${lerp(14, 11.6, settle).toFixed(1)}`, cx - R * 0.82, cy + R * 0.5);
  if (settle > 0.99 && Math.floor(T * 4) % 2) hctx.fillText('LOCK', cx - R * 0.82, cy + R * 0.5 + h * 0.03);
  hctx.restore();
  hudDirty = true;
}

/* =====================================================================
   Frame update
   ===================================================================== */
const camState = { pos: v3(), look: v3(), fov: 40, roll: 0 };
const prevVP = new THREE.Matrix4(), curVP = new THREE.Matrix4();
let lastShot = null, cutAt = -1;
STATE.trauma = 0;
function currentShot(T) { for (const s of SHOTS) if (T >= s.t0 && T < s.t1) return s; return SHOTS[SHOTS.length - 1]; }
function applyCamera(T, S, dt) {
  const sh = currentShot(T);
  const u = sat((T - sh.t0) / (sh.t1 - sh.t0));
  BULLET.mesh.visible = false;
  sh.cam(u, camState);
  STATE.shot = sh;
  camera.position.copy(camState.pos);
  camera.up.set(0, 1, 0);
  camera.lookAt(camState.look);
  // responsive framing: widen vertical FOV on narrow screens
  const asp = camera.aspect;
  let fov = camState.fov;
  if (asp < 1.6) fov = THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(fov) / 2) * Math.min(2.2, 1.6 / asp)));
  camera.fov = fov;
  // handheld + impact shake (every shot gets some)
  const tr = STATE.trauma * STATE.trauma;
  const amp = sh.shake + tr * (sh.scope ? 0.004 : 0.05);
  const rt2 = U.realTime.value;
  camera.rotateY(wobble(rt2 * 1.6, 1.3) * amp); camera.rotateX(wobble(rt2 * 1.9, 4.1) * amp); camera.rotateZ(wobble(rt2 * 1.2, 7.7) * amp * 0.6);
  if (tr > 0) camera.position.add(v3(wobble(rt2 * 14, 2) * tr * 0.04, wobble(rt2 * 13, 5) * tr * 0.04, 0));
  camera.updateProjectionMatrix();
  camera.updateMatrixWorld(true);
  const cut = sh !== lastShot; if (cut) cutAt = T;
  lastShot = sh;
  return { sh, u, cut };
}
const flareTmp = [];
function updateFlares() {
  const fl = cine.uniforms.uFl.value, fc = cine.uniforms.uFlC.value;
  flareTmp.length = 0;
  for (const f of FLARE_SRC) {
    let I = f.I;
    if (f.dyn) I = Math.min(2.5, f.dyn.intensity / 18);
    if (f.on && !f.on()) I = 0;
    if (I <= 0.01) continue;
    const p = f.get(_v1);
    const d = p.distanceTo(camera.position);
    _v2.copy(p).project(camera);
    if (_v2.z > 1 || Math.abs(_v2.x) > 1.1 || Math.abs(_v2.y) > 1.1) continue;
    flareTmp.push({ x: _v2.x * 0.5 + 0.5, y: _v2.y * 0.5 + 0.5, I: I / (1 + d * 0.035), c: f.col });
  }
  flareTmp.sort((a, b) => b.I - a.I);
  for (let i = 0; i < NFL; i++) {
    const f = flareTmp[i];
    if (f) { fl[i].set(f.x, f.y, f.I * 0.55, 0); fc[i].set(f.c[0], f.c[1], f.c[2]); } else fl[i].set(0, 0, 0, 0);
  }
}
function update(dt, visual = true) {
  const T = STATE.T;
  const S = Sof(T);
  const dS = Math.max(0, S - STATE.S);
  STATE.S = S; STATE.ts = timeScaleAt(T);
  U.time.value = S;
  if (STATE.playing) U.realTime.value += dt;
  while (evI < EVENTS.length && EVENTS[evI].t <= T) EVENTS[evI++].f();
  directCars(T, S);
  directRivals(T, S);
  directGang(T, S);
  directHero(T, S);
  directSniper(T, S);
  directProps(T, S, dS);
  for (const c of ALL_CHARS) c.update(S, dS);
  const { sh, u, cut } = applyCamera(T, S, dt);
  ambient(T, S, dS);
  for (const k of ['smoke', 'fog', 'glow', 'flash']) FX[k].update(dS);
  FX.streaks.update(dS, STATE.ts);
  for (const k of ['splinters', 'glass', 'casings', 'chips', 'planks', 'feathers', 'bills']) FX[k].update(dS);
  updateFlashPool(dS);
  STATE.trauma = Math.max(0, STATE.trauma - dt * 1.1);
  // rain
  rain.t += dS;
  const ru = rain.uni;
  ru.uT.value = rain.t; ru.uCam.value.copy(camera.position);
  ru.uStretch.value = 0.034 * Math.max(0.03, STATE.ts);
  ru.uNear.value = sh.scope ? 60 : sh.bullet ? 0.15 : 0.3;
  ru.uWidth.value = sh.bullet ? 0.0035 : 0.006;
  if (rain.blastT !== undefined) { const a = S - rain.blastT; ru.uBlast.value.w = a * 30; ru.uBlastStr.value = Math.exp(-a * 1.5) * 1.2; }
  for (let i = 0; i < 5; i++) { const l = flashPool[i]; ru.uLP.value[i].set(l.position.x, l.position.y, l.position.z, l.intensity * 0.02); ru.uLC.value[i].copy(l.color); }
  ru.uLP.value[5].set(neon.light.position.x, neon.light.position.y, neon.light.position.z, neon.light.intensity * 0.05); ru.uLC.value[5].copy(neon.light.color);
  // fog per shot
  U.fogDensity.value = lerp(U.fogDensity.value, sh.fog, cut ? 1 : 0.15);
  scene.fog.density = U.fogDensity.value;
  sky.position.copy(camera.position);
  if (!visual) return { sh, u, cut };
  updateRefl(camera);
  freighter.position.y = WATER_Y + Math.sin(U.realTime.value * 0.4) * 0.12;
  MAT.water.normalMap.offset.set(U.realTime.value * 0.004, U.realTime.value * 0.007);
  // post uniforms
  curVP.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
  if (cut) prevVP.copy(curVP);
  camera.getWorldDirection(_v1); _v1.multiplyScalar(10).add(camera.position);
  _v2.copy(_v1).applyMatrix4(curVP); _v3.copy(_v1).applyMatrix4(prevVP);
  const bx = (_v2.x - _v3.x) * 0.5, by = (_v2.y - _v3.y) * 0.5;
  const bl = Math.hypot(bx, by), maxB = 0.035;
  const kB = bl > maxB ? maxB / bl : 1;
  cine.uniforms.uBlur.value.set(bx * kB * 0.9, by * kB * 0.9);
  prevVP.copy(curVP);
  cine.uniforms.uRadial.value = sh.bullet ? 0.03 : (sh.name === 'blast' ? 0.03 * STATE.trauma : 0);
  cine.uniforms.uCA.value = 0.004 + STATE.trauma * 0.01 + (sh.bullet ? 0.004 : 0) + (sh.scope ? 0.008 : 0);
  cine.uniforms.uAspect.value = camera.aspect;
  updateFlares();
  const fu = finalPass.uniforms;
  fu.uTime.value = U.realTime.value; fu.uAspect.value = camera.aspect;
  // fades: in at the start, out at the end, a soft dip on every cut
  let fade = smooth(0.0, 1.4, T) * (1 - smooth(74.2, 74.95, T));
  for (const s of SHOTS) { const d = Math.abs(T - s.t0); if (s.t0 > 0.5 && d < 0.09) fade *= lerp(0.55, 1, d / 0.09); }
  fu.uFade.value = fade;
  fu.uFlash.value = towerClock.flash > 0.5 && sh.tower ? (towerClock.flash - 0.5) * 0.5 : 0;
  fu.uScope.value = sh.scope ? 1 : 0;
  const ar = window.innerWidth / window.innerHeight;
  fu.uBars.value = clamp((1 - ar / 2.39) / 2, 0.0, 0.13) + (ar >= 2.3 ? 0.0 : 0);
  fu.uGrain.value = sh.scope ? 0.05 : 0.075;
  renderer.toneMappingExposure = sh.inside ? 1.05 : sh.tower ? 1.25 : 1.15;
  // only refresh the shadow maps that can matter for this shot
  lamp.spot.shadow.autoUpdate = T < 26;
  streetLamps[1].light.shadow.autoUpdate = !(sh.inside || sh.tower || sh.scope || sh.bullet);
  // HUD
  if (sh.scope) drawScopeHUD(T, u);
  else if (hudDirty) { hctx.clearRect(0, 0, hud.width, hud.height); hudDirty = false; }
  const tOn = smooth(1.2, 2.2, T) * (1 - smooth(5.0, 6.0, T));
  titleEl.style.opacity = tOn.toFixed(3);
  titleEl.style.bottom = Math.max(14, fu.uBars.value * window.innerHeight * 0.5 - 8) + 'px';
  return { sh, u, cut };
}

/* =====================================================================
   Resize, dynamic resolution, UI, main loop
   ===================================================================== */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setPixelRatio(pixelRatio); renderer.setSize(w, h, false);
  composer.setPixelRatio(pixelRatio); composer.setSize(w, h);
  // fresh multisampled targets (resizing MSAA targets in place can leave them unusable on some drivers)
  composer.reset(new THREE.WebGLRenderTarget(Math.round(w * pixelRatio), Math.round(h * pixelRatio), { type: THREE.HalfFloatType, samples: 4 }));
  bloom.resolution.set(w, h);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  hud.width = Math.round(w * dpr); hud.height = Math.round(h * dpr); hudDirty = true;
}
window.addEventListener('resize', resize);
let frameEMA = 1 / 60, lastAdapt = 0;
function adaptResolution(dt, now) {
  frameEMA = lerp(frameEMA, dt, 0.05);
  if (now - lastAdapt < 1500) return;
  if (frameEMA > 1 / 38 && pixelRatio > 0.55) { pixelRatio = Math.max(0.55, pixelRatio - 0.15); lastAdapt = now; resize(); }
  else if (frameEMA < 1 / 57 && pixelRatio < MAX_PR) { pixelRatio = Math.min(MAX_PR, pixelRatio + 0.1); lastAdapt = now; resize(); }
}
function restart(t = 0) {
  STATE.T = 0; STATE.S = 0; resetWorld(); lastShot = null;
  if (t > 0) seek(t);
  SND.reset();
}
function seek(t) {
  SND.silent = true;
  for (let x = 0; x < t; x += 1 / 30) { STATE.T = x; update(1 / 30, false); }
  STATE.T = t;
  SND.silent = false;
}
const btnSound = document.getElementById('btnSound'), btnPause = document.getElementById('btnPause'), btnReplay = document.getElementById('btnReplay');
const icoSound = document.getElementById('icoSound'), icoPause = document.getElementById('icoPause');
const ICON_ON = '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none"/>';
const ICON_OFF = '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2" fill="none"/>';
function toggleSound() {
  if (!SND.on) { SND.start(); if (SND.ctx && !STATE.playing) SND.ctx.suspend(); SND.setMuted(false); }
  else SND.setMuted(!SND.muted);
  if (SND.ctx && SND.ctx.state === 'suspended' && STATE.playing) SND.ctx.resume();
  const on = SND.on && !SND.muted;
  icoSound.innerHTML = on ? ICON_ON : ICON_OFF;
  btnSound.classList.remove('pulse');
  document.getElementById('hint').style.opacity = 0;
}
function togglePause() {
  STATE.playing = !STATE.playing;
  icoPause.innerHTML = STATE.playing ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M7 5l12 7-12 7z"/>';
  btnPause.setAttribute('aria-label', STATE.playing ? 'Pause' : 'Play');
  if (SND.ctx) STATE.playing ? SND.ctx.resume() : SND.ctx.suspend();
}
btnSound.addEventListener('click', toggleSound);
btnPause.addEventListener('click', togglePause);
btnReplay.addEventListener('click', () => { restart(0); if (!STATE.playing) togglePause(); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') restart(0);
  else if (e.key === 'm' || e.key === 'M') toggleSound();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && STATE.playing) togglePause(); });

const bar = document.getElementById('bar');
let lastNow = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (now - lastNow) / 1000)); lastNow = now;
  if (STATE.playing) {
    STATE.T += dt;
    if (STATE.T >= DURATION) restart(0);
  }
  adaptResolution(dt, now); // resize before drawing so a resolution change never shows an empty frame
  update(dt);
  SND.update(dt);
  composer.render(dt);
  bar.style.width = (STATE.T / DURATION * 100).toFixed(2) + '%';
}

// boot
titleEl.textContent = 'Pier 9 · Harbour District · 1947';
seedAtmosphere();
resize();
const startT = parseFloat(new URLSearchParams(location.search).get('t')) || 0;
if (startT > 0) restart(Math.min(startT, DURATION - 0.1)); else update(0);
{
  // compile every shader up front (hidden things too) so nothing hitches mid-film
  const hidden = []; scene.traverse(o => { if (!o.visible) { hidden.push(o); o.visible = true; } });
  renderer.compile(scene, camera);
  hidden.forEach(o => (o.visible = false));
}
document.getElementById('loading').style.opacity = 0;
setTimeout(() => document.getElementById('loading').remove(), 900);
window.__film = { seek: t => restart(t), state: STATE, pause: () => { if (STATE.playing) togglePause(); }, render: () => { update(0); composer.render(0); } };
requestAnimationFrame(t => { lastNow = t; frame(t); });
</script>
