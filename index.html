<script type="module">

/* =====================================================================

/* =====================================================================

   ===================================================================== */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const MAX_PR = Math.min(window.devicePixelRatio || 1, 1.5);
let pixelRatio = Math.min(MAX_PR, 1.25);
renderer.setPixelRatio(pixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;

renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAX_ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

// fog: capped exponential so distant landmarks keep a silhouette
THREE.ShaderChunk.fog_fragment = `
#ifdef USE_FOG
  #ifdef FOG_EXP2
    float fogFactor = ( 1.0 - exp( - fogDensity * vFogDepth ) ) * 0.93;
  #else
    float fogFactor = smoothstep( fogNear, fogFar, vFogDepth );
  #endif
  gl_FragColor.rgb = mix( gl_FragColor.rgb, fogColor, fogFactor );

const scene = new THREE.Scene();
const FOG_COLOR = new THREE.Color(0x0d121b);
scene.fog = new THREE.FogExp2(FOG_COLOR.getHex(), 0.02);
scene.background = FOG_COLOR.clone();
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 1500);
scene.add(camera);
// shared uniforms for custom shaders
const U = {
  time: { value: 0 },         // story time (S)
  realTime: { value: 0 },
  fogColor: { value: FOG_COLOR },
  fogDensity: { value: 0.02 },
};

/* =====================================================================
   Procedural canvas textures
   ===================================================================== */
function makeCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function canvasTex(c, { srgb = true, repeat = true, aniso = MAX_ANISO } = {}) {

// height (0..1 Float32Array) -> tangent-space normal map canvas (tileable)
function heightToNormal(hgt, w, h, strength) {

// --- wet cobblestones (one tile = 3 m) ---
function makeCobbleTextures() {
  const S = 1024, r = mulberry32(11);

      x += w;

    const cx = (s.x0 + s.x1) / 2, cy = (s.y0 + s.y1) / 2, hw = (s.x1 - s.x0) / 2 - 3, hh = (s.y1 - s.y0) / 2 - 3;

// --- brick (one tile = 4 m) ---
function makeBrickTextures(seed, tint = [1, 1, 1]) {

// --- wood grain (planks) ---
function makeWoodTexture(seed, base = [0.32, 0.19, 0.11], planks = 6, size = 512) {

function makeCrateTexture() {

// --- concrete slabs (one tile = 3 m) ---

// --- water ripples normal map ---
function makeWaterNormal() {
  const S = 256; const hgt = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) hgt[y * S + x] = noise.fbm(x / S * 8, y / S * 8, 4, 8) * 0.7 + noise(x / S * 32, y / S * 32, 32) * 0.3;

}

// --- generic sprites ---

/* =====================================================================
   Static geometry batching (merge per material)
   ===================================================================== */
const batches = new Map();
function batchAdd(geo, mat, matrix, { cast = false } = {}) {
  const key = mat.uuid + (cast ? 'c' : '');
  if (!batches.has(key)) batches.set(key, { mat, cast, list: [] });
  const g = geo.index ? geo : (() => { const n = geo.attributes.position.count; geo.setIndex([...Array(n).keys()]); return geo; })();
  batches.get(key).list.push({ g, m: matrix.clone() });
}
function flushBatches(parent) {
  for (const { mat, cast, list } of batches.values()) {
    let nv = 0, ni = 0; for (const { g } of list) { nv += g.attributes.position.count; ni += g.index.count; }
    const pos = new Float32Array(nv * 3), nor = new Float32Array(nv * 3), uv = new Float32Array(nv * 2);
    const idx = nv > 65535 ? new Uint32Array(ni) : new Uint16Array(ni);
    let ov = 0, oi = 0; const nm = new THREE.Matrix3();
    for (const { g, m } of list) {
      nm.getNormalMatrix(m);
      const P = g.attributes.position, N = g.attributes.normal, T = g.attributes.uv, I = g.index;
      for (let i = 0; i < P.count; i++) {
        _v1.fromBufferAttribute(P, i).applyMatrix4(m); pos.set([_v1.x, _v1.y, _v1.z], (ov + i) * 3);
        _v2.fromBufferAttribute(N, i).applyMatrix3(nm).normalize(); nor.set([_v2.x, _v2.y, _v2.z], (ov + i) * 3);
        if (T) { uv[(ov + i) * 2] = T.getX(i); uv[(ov + i) * 2 + 1] = T.getY(i); }
      }
      for (let i = 0; i < I.count; i++) idx[oi + i] = I.getX(i) + ov;
      ov += P.count; oi += I.count;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
    geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    geo.setIndex(new THREE.BufferAttribute(idx, 1));
    geo.computeBoundingSphere();
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = cast; mesh.receiveShadow = true; mesh.matrixAutoUpdate = false;
    parent.add(mesh);
  }
  batches.clear();
}
const _o = new THREE.Object3D();
function mtx(x, y, z, ry = 0, rx = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  _o.position.set(x, y, z); _o.rotation.set(rx, ry, rz); _o.scale.set(sx, sy, sz); _o.updateMatrix(); return _o.matrix;

// box with world-space UVs (texture tile size in metres)
function sBox(w, h, d, mat, x, y, z, { tile = 4, ry = 0, cast = false } = {}) {
  const g = new THREE.BoxGeometry(w, h, d);
  const P = g.attributes.position, N = g.attributes.normal, T = g.attributes.uv;
  for (let i = 0; i < P.count; i++) {
    const px = P.getX(i) + x, py = P.getY(i) + y, pz = P.getZ(i) + z;
    const nx = Math.abs(N.getX(i)), ny = Math.abs(N.getY(i));
    if (nx > 0.5) T.setXY(i, pz / tile, py / tile); else if (ny > 0.5) T.setXY(i, px / tile, pz / tile); else T.setXY(i, px / tile, py / tile);

  fragmentShader: `
    varying vec3 vDir; uniform float uTime; uniform float uFlash;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);

    float fbm(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<5;i++){ s+=a*n(p); p*=2.03; a*=0.5; } return s; }
    void main(){
      float y = clamp(vDir.y, -0.2, 1.0);
      vec3 top = vec3(0.006, 0.009, 0.016), hor = vec3(0.075, 0.052, 0.045);
      vec3 col = mix(hor, top, pow(clamp(y * 2.2, 0.0, 1.0), 0.6));

  streetLamps[1].light.shadow.autoUpdate = !(sh.inside || sh.tower || sh.scope || sh.bullet);
  // HUD
  if (sh.scope) drawScopeHUD(T, u);
  else if (hudDirty) { hctx.clearRect(0, 0, hud.width, hud.height); hudDirty = false; }
  const tOn = smooth(1.2, 2.2, T) * (1 - smooth(5.0, 6.0, T));
  titleEl.style.opacity = tOn.toFixed(3);
  titleEl.style.bottom = Math.max(14, fu.uBars.value * window.innerHeight * 0.5 - 8) + 'px';
  return { sh, u, cut };
}

/* =====================================================================
   Resize, dynamic resolution, UI, main loop
   ===================================================================== */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h; camera.updateProjectionMatrix();
  renderer.setPixelRatio(pixelRatio); renderer.setSize(w, h, false);
  composer.setPixelRatio(pixelRatio); composer.setSize(w, h);
  // fresh multisampled targets (resizing MSAA targets in place can leave them unusable on some drivers)
  composer.reset(new THREE.WebGLRenderTarget(Math.round(w * pixelRatio), Math.round(h * pixelRatio), { type: THREE.HalfFloatType, samples: 4 }));
  bloom.resolution.set(w, h);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  hud.width = Math.round(w * dpr); hud.height = Math.round(h * dpr); hudDirty = true;
}
window.addEventListener('resize', resize);
let frameEMA = 1 / 60, lastAdapt = 0;
function adaptResolution(dt, now) {
  frameEMA = lerp(frameEMA, dt, 0.05);
  if (now - lastAdapt < 1500) return;
  if (frameEMA > 1 / 38 && pixelRatio > 0.55) { pixelRatio = Math.max(0.55, pixelRatio - 0.15); lastAdapt = now; resize(); }
  else if (frameEMA < 1 / 57 && pixelRatio < MAX_PR) { pixelRatio = Math.min(MAX_PR, pixelRatio + 0.1); lastAdapt = now; resize(); }
}
function restart(t = 0) {
  STATE.T = 0; STATE.S = 0; resetWorld(); lastShot = null;
  if (t > 0) seek(t);
  SND.reset();
}
function seek(t) {
  SND.silent = true;
  for (let x = 0; x < t; x += 1 / 30) { STATE.T = x; update(1 / 30, false); }
  STATE.T = t;
  SND.silent = false;
}
const btnSound = document.getElementById('btnSound'), btnPause = document.getElementById('btnPause'), btnReplay = document.getElementById('btnReplay');
const icoSound = document.getElementById('icoSound'), icoPause = document.getElementById('icoPause');
const ICON_ON = '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none"/>';
const ICON_OFF = '<path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5l5 5m0-5l-5 5" stroke="currentColor" stroke-width="2" fill="none"/>';
function refreshSoundIcon() {
  const on = (SND.on || SND.pending) && !SND.muted;
  icoSound.innerHTML = on ? ICON_ON : ICON_OFF;
  const hint = document.getElementById('hint');
  if (SND.pending && !SND.on) { hint.textContent = 'Preparing sound…'; hint.style.opacity = 1; }
  else hint.style.opacity = 0;
}
function toggleSound() {
  if (!SND.on && !SND.pending) { SND.muted = false; SND.start(); }
  else if (SND.pending && !SND.on) SND.pending = false;
  else SND.setMuted(!SND.muted);
  if (SND.ctx && SND.ctx.state === 'suspended' && STATE.playing) SND.ctx.resume();
  btnSound.classList.remove('pulse');
  refreshSoundIcon();
}
SND.onStart = refreshSoundIcon;
function togglePause() {
  STATE.playing = !STATE.playing;
  icoPause.innerHTML = STATE.playing ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M7 5l12 7-12 7z"/>';
  btnPause.setAttribute('aria-label', STATE.playing ? 'Pause' : 'Play');
  if (SND.ctx) STATE.playing ? SND.ctx.resume() : SND.ctx.suspend();
}
btnSound.addEventListener('click', toggleSound);
btnPause.addEventListener('click', togglePause);
btnReplay.addEventListener('click', () => { restart(0); if (!STATE.playing) togglePause(); });
window.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.key === 'r' || e.key === 'R') restart(0);
  else if (e.key === 'm' || e.key === 'M') toggleSound();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && STATE.playing) togglePause(); });

const bar = document.getElementById('bar');
let lastNow = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.1, Math.max(0, (now - lastNow) / 1000)); lastNow = now;
  if (STATE.playing) {
    // while sound runs, the film follows the audio clock so picture and score stay locked
    if (SND.running()) STATE.T = Math.max(STATE.T, SND.clock()); else STATE.T += dt;
    if (STATE.T >= DURATION) restart(0);
  }
  adaptResolution(dt, now); // resize before drawing so a resolution change never shows an empty frame
  update(dt);
  SND.update(dt);
  composer.render(dt);
  bar.style.width = (STATE.T / DURATION * 100).toFixed(2) + '%';
}

// boot
titleEl.textContent = 'Pier 9 · Harbour District · 1947';
seedAtmosphere();
resize();
const startT = parseFloat(new URLSearchParams(location.search).get('t')) || 0;
if (startT > 0) restart(Math.min(startT, DURATION - 0.1)); else update(0);
{
  // compile every shader up front (hidden things too) so nothing hitches mid-film
  const hidden = []; scene.traverse(o => { if (!o.visible) { hidden.push(o); o.visible = true; } });
  renderer.compile(scene, camera);
  hidden.forEach(o => (o.visible = false));
}
document.getElementById('loading').style.opacity = 0;
setTimeout(() => document.getElementById('loading').remove(), 900);
SND.prepare();
window.__dbg = { THREE, scene, camera, composer, renderer, cine, finalPass, bloom, SND, FX, cars, ALL_CHARS, chars: () => ALL_CHARS.map(c => [c.name, c.root.visible, c.alive, c.root.getWorldPosition(v3()).toArray().map(x => +x.toFixed(2))]), heads: () => Object.fromEntries(ALL_CHARS.map(c => [c.name, c.headPos(v3()).toArray().map(x => +x.toFixed(2))])), bike: () => bike.root.position.toArray().map(x => +x.toFixed(2)).concat([+bike.root.rotation.y.toFixed(2)]) };
window.__film = { seek: t => restart(t), state: STATE, pause: () => { if (STATE.playing) togglePause(); }, render: () => { update(0); composer.render(0); } };
requestAnimationFrame(t => { lastNow = t; frame(t); });
</script>
