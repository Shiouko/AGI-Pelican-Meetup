  } else if (type === 'brass') {

    const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.09 * vel, t + 0.04); g.gain.setValueAtTime(0.08 * vel, t + dur * 0.8); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.25);

(function buildScore() {
  const motif = [[0, 2, 0], [1.5, 0.5, 7], [2, 1, 5], [3, 1, 3]];
  PROG.forEach((name, b) => {
    const t0 = b * BAR, ch = CH[name], drive = (b >= 7 && b <= 12) || (b >= 17 && b <= 21), half = b >= 13 && b <= 16, fin = b >= 24;
    if (t0 >= DURATION) return;
    // strings pad on every bar
    if (!fin) for (const m of ch) nt(t0, t => inst('str', t, BAR, m + 12, b < 3 ? 0.6 : 0.9));
    if (b < 3) nt(t0, t => inst('str', t, BAR, ch[0] - 12, 0.8));
    if (b >= 3 && b <= 6) for (let k = 0; k < 2; k++) nt(t0 + k * BAR / 2, t => inst('bass', t, BAR / 2, ch[0] - 12, 0.7));
    if (drive) {
      for (let s = 0; s < 8; s++) nt(t0 + s * BEAT / 2, t => inst('bass', t, BEAT / 2 * 0.9, ch[0] - 12 + (s % 4 === 3 ? 12 : 0), 1));
      for (const bt of [0, 1.5, 2, 3.5]) nt(t0 + bt * BEAT, t => inst('kick', t, 0, 0, 1));
      for (const bt of [1, 3]) nt(t0 + bt * BEAT, t => inst('snare', t, 0, 0, 1));
      for (let s = 0; s < 8; s++) nt(t0 + s * BEAT / 2, t => inst('hat', t, 0, 0, s % 2 ? 0.6 : 1));
      if (b % 2 === 0) for (let s = 0; s < 4; s++) nt(t0 + 3 * BEAT + s * BEAT / 4, t => inst('tom', t, 0, 52 - s * 3, 0.8));
      if (b >= 9) for (let s = 0; s < 16; s++) nt(t0 + s * BEAT / 4, t => inst('arp', t, 0, ch[s % 3] + 24 + (s >= 8 ? 12 : 0), 1));
      for (const [bt, d, iv] of motif) nt(t0 + bt * BEAT, t => inst('brass', t, d * BEAT, ch[0] + 12 + iv + (b >= 17 ? 12 : 0), 0.9));
    }
    if (half) {
      for (const bt of [0, 2]) nt(t0 + bt * BEAT, t => inst('tom', t, 0, 38, 1.2));
      for (const m of ch) nt(t0, t => inst('choir', t, BAR, m + 12, 0.9));
      nt(t0, t => inst('bass', t, BAR, ch[0] - 12, 0.6));

    if (b === 22 || b === 23) {

  for (let s = 0; s < 12; s++) nt(9.7 + s * 0.11, t => inst('tom', t, 0, 45, 0.3 + s * 0.06));
  nt(9.8, t => inst('swell', t, 1.2, 0, 0.9));
  nt(31.4, t => inst('swell', t, 1.2, 0, 0.9));
  nt(7.2, t => { inst('boom', t, 0, 0, 1); for (const m of [38, 45, 50, 53]) inst('brass', t, 1.2, m, 1); });
  nt(28.5, t => inst('boom', t, 0, 0, 0.7));
  nt(40.55, t => inst('boom', t, 0, 0, 1.2));
  nt(41.15, t => { inst('boom', t, 0, 0, 0.6); for (const m of [38, 50, 54, 57, 62, 66, 69]) { inst('str', t, 3.6, m, 1.1); inst('brass', t, 3.4, m, 1); inst('choir', t, 3.6, m + 12, 0.8); } });
  for (const bt of [0, 0.5, 0.75, 1]) nt(41.15 + 2.2 + bt * BEAT, t => inst('tom', t, 0, 43, 0.9));

})();
let noteIdx = 0;
function scheduleMusic(t) {
  if (!AU.ctx || !AU.on || !playing) return;
  while (noteIdx < NOTES.length && NOTES[noteIdx].t < t + 0.2) {
    const n = NOTES[noteIdx++];
    if (n.t >= t - 0.05) n.fn(AU.ctx.currentTime + Math.max(0, n.t - t) + 0.02);

}
function seekMusic(t) { noteIdx = 0; while (noteIdx < NOTES.length && NOTES[noteIdx].t < t) noteIdx++; }

// ============================================================================
// Post-processing: bloom -> motion blur, god rays, lens flares, grain -> ACES
// ============================================================================
let postFlash = 0;
const FinalShader = {
  uniforms: {
    tDiffuse: { value: null }, uBlur: { value: new THREE.Vector2() }, uRadial: { value: 0 }, uTime: { value: 0 }, uFade: { value: 1 },
    uFlash: { value: 0 }, uSun: { value: new THREE.Vector3() }, uFl: { value: [0, 1, 2, 3].map(() => new THREE.Vector3()) }, uAspect: { value: 1 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform vec2 uBlur; uniform float uRadial; uniform float uTime; uniform float uFade; uniform float uFlash;
    uniform vec3 uSun; uniform vec3 uFl[4]; uniform float uAspect; varying vec2 vUv;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    float lum(vec3 c){ return dot(c,vec3(0.2126,0.7152,0.0722)); }
    vec3 flare(vec2 uv, vec3 F, vec3 tint){
      if(F.z<=0.001) return vec3(0.);

      float k=F.z*vis; if(k<=0.001) return vec3(0.);
      vec2 asp=vec2(uAspect,1.); vec2 d=(uv-F.xy)*asp; float r=length(d);
      vec3 c=tint*exp(-r*7.)*0.5 + tint*0.25/(1.+r*r*1500.);
      c+=vec3(0.45,0.6,1.)*exp(-abs(d.y)*110.)*exp(-abs(d.x)*2.4)*0.55;
      vec2 axis=vec2(0.5)-F.xy;
      for(int i=0;i<5;i++){ float f=float(i); vec2 gp=F.xy+axis*(0.55+f*0.42);
        float gr=length((uv-gp)*asp); float rad=0.018+0.026*mod(f*1.7,3.);
        c+=mix(vec3(1.,0.45,0.15),vec3(0.35,0.55,1.),f/4.)*smoothstep(rad,rad*0.65,gr)*0.07; }
      float hr=length((uv-(F.xy+axis*2.))*asp); c+=tint*smoothstep(0.012,0.,abs(hr-0.16))*0.05;
      return c*k;
    }
    void main(){
      vec2 uv=vUv; vec2 cd=uv-0.5;
      vec2 dir=uBlur+cd*uRadial;
      float j=hash(uv*913.+fract(uTime));
      vec3 col=vec3(0.); float ca=0.0018+0.004*dot(cd,cd);
      for(int i=0;i<8;i++){ float k=(float(i)+j)/8.-0.5; vec2 p=uv+dir*k;

        for(int i=0;i<24;i++){ c-=dl; vec3 s=min(texture2D(tDiffuse,c).rgb,vec3(6.)); acc+=s*max(lum(s)-1.6,0.)*dec; dec*=0.93; }
        col+=acc*0.012*uSun.z*vec3(1.,0.7,0.45); }
      col+=flare(uv,uSun,vec3(1.,0.62,0.32));
      for(int i=0;i<4;i++) col+=flare(uv,uFl[i],vec3(1.,0.55,0.25));
      col*=vec3(1.03,0.99,1.02);
      float v=smoothstep(1.25,0.35,length(cd*vec2(uAspect*0.75,1.))); col*=mix(0.5,1.,v);
      col+=(hash(uv*vec2(1731.,977.)+fract(uTime*7.31))-0.5)*0.035;

    }`
};
const composer = new EffectComposer(renderer);
composer.setPixelRatio(DPR); composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.6, 0.5, 1.1);
composer.addPass(bloom);
const finalPass = new ShaderPass(FinalShader); composer.addPass(finalPass);
composer.addPass(new OutputPass());

const prevVP = new THREE.Matrix4(), prevCam = V3(); let prevValid = false;
const _fwd = V3(), _pp = V3();
function updatePost(t, time) {
  const U = finalPass.uniforms;
  U.uTime.value = time; U.uAspect.value = innerWidth / innerHeight;
  camera.getWorldDirection(_fwd);
  if (cutHappened || !prevValid) { U.uBlur.value.set(0, 0); U.uRadial.value = 0; cutHappened = false; }
  else {
    _pp.copy(camera.position).addScaledVector(_fwd, 40).applyMatrix4(prevVP);
    const bx = clamp((0 - _pp.x) * 0.5 * 0.6, -0.04, 0.04), by = clamp((0 - _pp.y) * 0.5 * 0.6, -0.04, 0.04);
    U.uBlur.value.set(bx, by);
    U.uRadial.value = clamp(_v1.copy(camera.position).sub(prevCam).dot(_fwd) * 0.006, -0.02, 0.03);
  }
  prevVP.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse); prevCam.copy(camera.position); prevValid = true;

    _pp.copy(p).project(camera);
    if (_pp.z > 1 || I <= 0) return out.set(0, 0, 0);
    const edge = Math.max(Math.abs(_pp.x), Math.abs(_pp.y));
    return out.set(_pp.x * 0.5 + 0.5, _pp.y * 0.5 + 0.5, I * (1 - sstep(0.95, 1.25, edge)));
  };
  proj(_v1.copy(camera.position).addScaledVector(SUN_DIR, 1000), 1, U.uSun.value);
  flares.sort((a, b) => b.I - a.I);
  for (let i = 0; i < 4; i++) { const f = flares[i]; if (f) proj(f.p, f.I, U.uFl.value[i]); else U.uFl.value[i].set(0, 0, 0); }
  U.uFade.value = sstep(0, 0.9, t) * (1 - sstep(44.1, 45, t));
  U.uFlash.value = postFlash;
}

// ============================================================================
// Main loop, reset, resize, controls
// ============================================================================
let playing = true, last = performance.now(), clockTime = 0;
function resetAll() {
  T = 0; pending.length = 0; flares.length = 0; postFlash = 0; shakeAmp = 0;
  PSYS.forEach(p => p.clear()); debris.clear(); trench.clear();
  rockets.forEach(r => { r.on = false; r.g.visible = false; });
  lightPool.forEach(L => { L.I = 0; L.l.intensity = 0; });
  mon.flinch = 0; mon.walk = 0; lastStepSign = 0;
  seekMusic(0); prevValid = false;
}
function layoutBars() {
  const h = Math.max(0, (innerHeight - innerWidth / 2.39) / 2);
  $('barTop').style.height = $('barBot').style.height = Math.round(h) + 'px';
}
function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  layoutBars(); prevValid = false;
}
addEventListener('resize', onResize); layoutBars();

function update(rdt) {
  const prev = T;
  if (playing) {
    T += rdt;
    if (T >= DURATION) { fireEvents(prev, DURATION); resetAll(); }
    else fireEvents(prev, T);
  }
  const ts = slowFactor(T), dt = playing ? rdt * ts : 0;
  if (playing) clockTime += dt;
  const time = clockTime;
  skyMat.uniforms.uTime.value = time;
  swipeTop.visible = T < 12.33;
  updateCollapsers(T, dt);
  updateBus(T);
  pelicanUpdate(T, dt, time);
  monsterUpdate(T, dt, time);
  backblast = T > 32.4 && T < 35.5 ? 0.15 : 1;
  updateRockets(dt);
  if (dt > 0) { PSYS.forEach(p => p.update(dt)); debris.update(dt); trench.update(dt); updateRings(dt); updateAmbient(dt, time); }
  for (const L of lightPool) { L.I *= Math.exp(-dt * L.k); L.l.intensity = L.I; }
  for (const f of flares) f.I *= Math.exp(-dt * 4.5);
  postFlash *= Math.exp(-rdt * 6);
  updateLamps(time);
  for (const s of signs) { let k = 1; if (s.flick) { const n = Math.sin(time * 19 + s.ph) + Math.sin(time * 7.7 + s.ph * 2); k = n > 1.5 * s.flick + 0.3 ? 0.15 : 1; } s.mat.color.setScalar(s.base * k); }
  hazardMat.color.setRGB(Math.sin(time * 9) > 0 ? 4 : 0.05, Math.sin(time * 9) > 0 ? 1.6 : 0.02, 0.05);
  beaconMesh.material.color.setRGB(Math.sin(time * 3) > 0.6 ? 6 : 0.3, 0.1, 0.08);
  searchlights.forEach(({ m, ph }) => { m.rotation.set(0.35 * Math.sin(time * 0.31 + ph), 0, 0.4 * Math.sin(time * 0.23 + ph * 1.7)); });
  updateCamera(T, playing ? rdt : 0, time);
  updateMotes(time);
  // sun shadow follows the action
  updateSunLight(_v4.copy(camLook).lerp(camera.position, 0.3).setY(0));
  const s = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov) / 2));
  PSYS.forEach(p => p.setScale(s));

  updatePost(T, time);

}
function frame(nowMs) {
  requestAnimationFrame(frame);
  const rdt = Math.min((nowMs - last) / 1000, 1 / 20); last = nowMs;
  update(rdt);
  composer.render();
}

// Controls
const btnSound = $('btnSound'), btnPause = $('btnPause');
function setSound(on) {
  if (on && !AU.ctx) audioInit();
  AU.on = on;
  if (AU.ctx) { if (on && AU.ctx.state !== 'running') AU.ctx.resume(); seekMusic(T); }
  btnSound.textContent = on ? '🔊 Sound' : '🔇 Sound'; btnSound.classList.toggle('on', on);
  $('hint').classList.add('hide');
}
function setPlaying(p) { playing = p; btnPause.textContent = p ? '❚❚' : '▶'; if (AU.ctx && AU.on) seekMusic(T); }
btnSound.onclick = () => setSound(!AU.on);
$('hint').onclick = () => setSound(true);
btnPause.onclick = () => setPlaying(!playing);
$('btnReplay').onclick = () => { resetAll(); setPlaying(true); };
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.code === 'KeyR') { resetAll(); setPlaying(true); }
  else if (e.code === 'KeyM') setSound(!AU.on);
});
// Optional deep link for previewing a moment: #t=26.5 (add &pause to freeze)
{
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has('t')) { const tt = parseFloat(h.get('t')) || 0; resetAll(); const step = 1 / 30; while (T < tt - 1e-6) update(Math.min(step, tt - T)); if (h.has('pause')) setPlaying(false); }
}
$('loading').remove();
requestAnimationFrame(t => { last = t; frame(t); });
</script>
